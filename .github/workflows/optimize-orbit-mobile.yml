name: Optimize local 3D carousel mobile photos
on:
  push:
    branches:
      - feature/carousel-native-performance-20261013
    paths:
      - .github/workflows/optimize-orbit-mobile.yml
permissions:
  contents: write
concurrency:
  group: optimize-orbit-mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image encoder
        run: python -m pip install Pillow==11.3.0
      - name: Recompress existing six mobile images (no changes to photography)
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          photos=sorted(Path('assets/orbit-photos').glob('*-mobile.webp'))
          assert len(photos)==6, f'Expected 6 mobile WebPs; found {len(photos)}'
          for p in photos:
              original=p.read_bytes()
              with Image.open(BytesIO(original)) as image:
                  assert image.format == 'WEBP'
                  image=image.convert('RGB')
                  width=min(480,image.width)
                  if width<image.width:
                      h=round(image.height*width/image.width)
                      image=image.resize((width,h),Image.Resampling.LANCZOS)
                  out=BytesIO()
                  image.save(out,format='WEBP',quality=64,method=6)
                  optimized=out.getvalue()
              if len(optimized) < len(original):
                  p.write_bytes(optimized)
                  print(f'{p}: {len(original)} -> {len(optimized)} bytes ({100*(1-len(optimized)/len(original)):.1f}% saved)')
              else:
                  print(f'{p}: retained original ({len(original)} bytes)')
          PY
      - name: Commit only image byte improvements on the isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/orbit-photos/*-mobile.webp
          if git diff --cached --quiet; then
            echo "No mobile files need optimizing."
          else
            git commit -m "perf(images): shrink six mobile 3D carousel WebPs while preserving photos"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
