name: Verify Signature website
on:
  push:
    branches: [refonte-signature-preview-20261010]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_site.py
      - run: node --check assets/film-experience.js
      - run: node --check assets/offer-inline-details.js
