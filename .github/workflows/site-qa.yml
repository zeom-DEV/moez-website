name: Verify client website
on:
  push:
    branches: [main, "refonte-clients-20261019", "fix/prospection-stable-20261015"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: client-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check assets/signature-clean.js
      - run: node --check assets/client-presence.js
      - run: python3 scripts/client-presence-check.py
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/site-server.log 2>&1 &
      - run: node scripts/client-presence-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-presence-qa
          path: qa/client-presence
          retention-days: 14
